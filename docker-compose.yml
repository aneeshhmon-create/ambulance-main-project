version: "3.9"

services:
  # ── FastAPI application ──────────────────────────────────────────────────────
  app:
    build: .
    container_name: ambulance_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app                    # live-reload: Python source
      - ./alembic:/app/alembic            # live-reload: migrations
      - ./alembic.ini:/app/alembic.ini    # alembic config
      - ./app/tests:/app/app/tests        # live-reload: tests
      - ./create_demo_incidents.py:/app/create_demo_incidents.py
      - ./accept_as_hospital.py:/app/accept_as_hospital.py
      - ./seed_demo_drivers.py:/app/seed_demo_drivers.py
      - ./seed_hospitals.py:/app/seed_hospitals.py
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ambulance_net

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: ambulance_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"             # expose locally for DB clients (pgAdmin, DBeaver)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ambulance_net

volumes:
  postgres_data:                # named volume → survives container restarts

networks:
  ambulance_net:
    driver: bridge
