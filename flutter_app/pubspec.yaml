name: ambulance_app
description: Ambulance allocation app — user & driver flavors.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: "^3.11.0"

dependencies:
  flutter:
    sdk: flutter

  # Shared
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  geolocator: ^14.1.1

  # User app only (no-op on driver build, unused code is tree-shaken)
  record: ^6.2.1
  permission_handler: 11.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  audioplayers: ^6.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.2

flutter:
  uses-material-design: true